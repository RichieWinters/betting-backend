<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Betting Platform</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background-color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .container {
        width: 100%;
        max-width: 400px;
      }

      .title {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 8px;
        text-align: center;
        color: #000;
      }

      .subtitle {
        font-size: 16px;
        color: #666;
        margin-bottom: 32px;
        text-align: center;
        line-height: 22px;
      }

      .input {
        width: 100%;
        height: 50px;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 0 16px;
        margin-bottom: 16px;
        font-size: 16px;
        font-family: inherit;
      }

      .input:focus {
        outline: none;
        border-color: #007aff;
      }

      .input:disabled {
        background-color: #f5f5f5;
        color: #999;
      }

      .button {
        width: 100%;
        height: 50px;
        background-color: #007aff;
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        font-family: inherit;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .button:hover {
        background-color: #0051d5;
      }

      .button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .button:disabled:hover {
        background-color: #007aff;
      }

      .error-message {
        background-color: #ffe5e5;
        color: #d32f2f;
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
        text-align: center;
        display: none;
      }

      .success-container {
        text-align: center;
        display: none;
      }

      .success-icon {
        font-size: 64px;
        color: #34c759;
        margin-bottom: 16px;
      }

      .success-text {
        font-size: 16px;
        color: #333;
        margin-bottom: 16px;
        line-height: 24px;
      }

      .instruction-text {
        font-size: 14px;
        color: #666;
        margin-bottom: 32px;
        line-height: 20px;
      }

      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 3px solid #fff;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .form-container {
        display: block;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-container" id="formContainer">
        <h1 class="title">Reset Password</h1>
        <p class="subtitle">Enter your new password</p>

        <div class="error-message" id="errorMessage"></div>

        <form id="resetForm">
          <input
            type="password"
            class="input"
            id="newPassword"
            placeholder="New Password"
            required
            minlength="6"
          />
          <input
            type="password"
            class="input"
            id="confirmPassword"
            placeholder="Confirm New Password"
            required
            minlength="6"
          />
          <button type="submit" class="button" id="submitButton">
            <span id="buttonText">Reset Password</span>
            <div class="spinner hidden" id="spinner"></div>
          </button>
        </form>
      </div>

      <div class="success-container" id="successContainer">
        <div class="success-icon">✓</div>
        <h1 class="title">Password Changed!</h1>
        <p class="success-text">Your password has been successfully reset.</p>
        <p class="instruction-text">
          Please return to the mobile app and log in with your new password.
        </p>
      </div>
    </div>

    <script>
      const form = document.getElementById('resetForm');
      const newPasswordInput = document.getElementById('newPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const submitButton = document.getElementById('submitButton');
      const buttonText = document.getElementById('buttonText');
      const spinner = document.getElementById('spinner');
      const errorMessage = document.getElementById('errorMessage');
      const formContainer = document.getElementById('formContainer');
      const successContainer = document.getElementById('successContainer');

      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        showError('Invalid reset link. Please request a new password reset.');
        submitButton.disabled = true;
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
        setTimeout(() => {
          errorMessage.style.display = 'none';
        }, 5000);
      }

      function setLoading(loading) {
        submitButton.disabled = loading;
        newPasswordInput.disabled = loading;
        confirmPasswordInput.disabled = loading;

        if (loading) {
          buttonText.classList.add('hidden');
          spinner.classList.remove('hidden');
        } else {
          buttonText.classList.remove('hidden');
          spinner.classList.add('hidden');
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!newPassword || !confirmPassword) {
          showError('Please fill in all fields');
          return;
        }

        if (newPassword !== confirmPassword) {
          showError('Passwords do not match');
          return;
        }

        if (newPassword.length < 6) {
          showError('Password must be at least 6 characters');
          return;
        }

        setLoading(true);

        try {
          const response = await fetch('/auth/reset-password', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              token: token,
              newPassword: newPassword,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || 'Invalid or expired token');
          }

          // Show success
          formContainer.classList.add('hidden');
          successContainer.style.display = 'block';
        } catch (error) {
          showError(
            error.message || 'Failed to reset password. Please try again.',
          );
          setLoading(false);
        }
      });
    </script>
  </body>
</html>
